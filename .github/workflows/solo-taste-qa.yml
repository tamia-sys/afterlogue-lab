name: Individual Taste Stability QA
on:
  push:
    branches: [main]
    paths:
      - recommendation-engine.js
      - solo-taste-validation.js
      - multi-archetype-audit.js
      - tests/solo-taste-validation.test.cjs
      - tests/multi-archetype-fixture.cjs
      - tests/multi-archetype-audit.test.cjs
      - .github/workflows/solo-taste-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  log-only-taste-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Log-only taste evidence, withheld ratings and preference stability
        run: node --test tests/solo-taste-validation.test.cjs tests/multi-archetype-audit.test.cjs
