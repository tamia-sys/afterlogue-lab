name: Bounded public-catalog fingerprint validation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/real-catalog-smoke.yml
      - tests/real-catalog-smoke.cjs
      - tests/real-catalog-publish.cjs
      - catalog-batch-audit.js
      - cinematic-fingerprint.js
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: afterlogue-real-catalog-smoke
  cancel-in-progress: false
jobs:
  catalog-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate no-credentials catalog runner with fictional fixtures
        run: node --test tests/real-catalog-smoke.test.cjs
      - name: Verify public film-catalog metadata on two fictional viewers
        run: node tests/real-catalog-smoke.cjs --profiles 2 --candidates 24 --plans 1 --output reports/real-catalog-smoke.json
      - name: Add aggregate findings to run summary
        if: always()
        run: node tests/real-catalog-report.cjs reports/real-catalog-smoke.json >> "$GITHUB_STEP_SUMMARY"
      - name: Write source-controlled aggregate-only validation digest
        if: always()
        run: node tests/real-catalog-publish.cjs reports/real-catalog-smoke.json docs/real-catalog-latest.json
      - name: Publish sanitized digest in Lab repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/real-catalog-latest.json
          if git diff --cached --quiet; then
            echo "Aggregate digest unchanged"
          else
            git commit -m "Record public catalog aggregate audit [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload aggregate-only diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-catalog-smoke-summary
          path: reports/real-catalog-smoke.json
          if-no-files-found: ignore
          retention-days: 2
